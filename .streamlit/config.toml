[theme]
base = "dark"
primaryColor = "#7C75FF"
backgroundColor = "#131A2B"
secondaryBackgroundColor = "#202A40"
textColor = "#E8EDF7"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseFontSize = 14
headingFontSizes = ["1.85rem", "1.45rem", "1.12rem", "1rem", "0.95rem", "0.9rem"]
headingFontWeights = [650, 650, 600, 600, 600, 600]
borderColor = "#35415A"
dataframeBorderColor = "#35415A"
dataframeHeaderBackgroundColor = "#25314A"
dataframeHeaderTextColor = "#E0E7F3"
baseRadius = "6px"
buttonRadius = "6px"
showWidgetBorder = true
showSidebarBorder = true
linkColor = "#B1ACFF"
linkUnderline = false
greenColor = "#38C8BA"
greenBackgroundColor = "#173E3D"
greenTextColor = "#8DE3D7"
blueColor = "#7C75FF"
blueBackgroundColor = "#302D59"
blueTextColor = "#C0BCFF"
yellowBackgroundColor = "#443923"
yellowTextColor = "#F2D28B"

[theme.sidebar]
backgroundColor = "#0D1322"
secondaryBackgroundColor = "#202A40"
textColor = "#E0E7F3"
primaryColor = "#7C75FF"
borderColor = "#2D3850"
linkColor = "#B1ACFF"
codeBackgroundColor = "#35415A"
blueBackgroundColor = "#302D59"
blueTextColor = "#C0BCFF"
greenBackgroundColor = "#173E3D"
greenTextColor = "#8DE3D7"
grayTextColor = "#A4B1C9"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
disableDataExport = true
showErrorDetails = "none"
