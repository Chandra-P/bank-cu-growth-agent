[theme]
base = "light"
primaryColor = "#1268AA"
backgroundColor = "#F4F6F9"
secondaryBackgroundColor = "#EDF2F7"
textColor = "#182233"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseFontSize = 14
headingFontSizes = ["1.85rem", "1.45rem", "1.12rem", "1rem", "0.95rem", "0.9rem"]
headingFontWeights = [650, 650, 600, 600, 600, 600]
borderColor = "#E2E7EE"
dataframeBorderColor = "#E2E7EE"
dataframeHeaderBackgroundColor = "#EFF4F8"
dataframeHeaderTextColor = "#23334A"
baseRadius = "12px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
linkColor = "#1168AA"
linkUnderline = false
greenColor = "#079B78"
greenBackgroundColor = "#E2F6ED"
greenTextColor = "#087252"
blueColor = "#1268AA"
blueBackgroundColor = "#E7F1FC"
blueTextColor = "#0C5794"
yellowBackgroundColor = "#FFF3DC"
yellowTextColor = "#7D570C"

[theme.sidebar]
backgroundColor = "#1466A5"
secondaryBackgroundColor = "#1B70AF"
textColor = "#FFFFFF"
primaryColor = "#07558F"
borderColor = "#4283B6"
linkColor = "#FFFFFF"
codeBackgroundColor = "#E2E7EE"
blueBackgroundColor = "#277CBD"
blueTextColor = "#FFFFFF"
greenBackgroundColor = "#E2F6ED"
greenTextColor = "#087252"
grayTextColor = "#D2E6F6"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
disableDataExport = true
showErrorDetails = "none"
